name: ScanForge
options:
  bundleIdPrefix: com.scanforge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # opcional: tu Team ID si compilas desde Xcode
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  ScanForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "ScanForge Pro"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "ScanForge usa las cámaras, el LiDAR y la cámara TrueDepth para escanear objetos en 3D."
        NSLocalNetworkUsageDescription: "ScanForge busca tu Mac en la red local para subir las capturas automáticamente."
        NSBonjourServices:
          - "_scanforge._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scanforge.ScanForge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

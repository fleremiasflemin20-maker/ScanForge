name: iOS build (IPA para sideload)

# Compila la app en un Mac de GitHub (sin firmar) y genera ScanForge.ipa.
# - En cada push/PR: artefacto descargable desde la pestaña Actions.
# - Al publicar un tag v*: crea una Release con el .ipa (lo usan Sideloadly,
#   AltStore y SideStore para instalar sin App Store).
on:
  push:
    branches: [main, "pro/**"]
    tags: ["v*"]
    paths:
      - "ios-capture/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios-capture/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-capture
    steps:
      - uses: actions/checkout@v5

      - name: Seleccionar el Xcode más reciente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generar proyecto con XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (Release, sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project ScanForge.xcodeproj \
            -scheme ScanForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:" xcodebuild.log | sort -u | head -100 || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScanForge.app Payload/
          zip -qry ScanForge.ipa Payload
          ls -lh ScanForge.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: ScanForge-ipa
          path: ios-capture/ScanForge.ipa

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ScanForge.ipa \
            --title "ScanForge Pro $GITHUB_REF_NAME" \
            --notes "IPA sin firmar para instalar con Sideloadly, AltStore o SideStore. Instrucciones: INSTALAR.md" \
            || gh release upload "$GITHUB_REF_NAME" ScanForge.ipa --clobber
